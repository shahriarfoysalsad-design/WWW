
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google SEO -->
    <title>Shahriar Foysal Sad Photos</title>

    <meta name="description"
          content="Shahriar Foysal Sad - Official personal website and photo gallery.">

    <meta name="keywords"
          content="Shahriar Foysal Sad, Shahriar Foysal Sad website, Shahriar Foysal Sad photos">

    <meta name="author" content="Shahriar Foysal Sad">

    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Shahriar Foysal Sad">
    <meta property="og:description"
          content="Official website and photo gallery of Shahriar Foysal Sad.">
    <meta property="og:type" content="website">

    <!-- Google image discovery -->
    <meta name="googlebot" content="index, follow, max-image-preview:large">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #172554 0%, #020617 45%, #000000 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */

        header {
            text-align: center;
            padding: 70px 20px 45px;
        }

        header h1 {
            font-size: clamp(32px, 7vw, 65px);
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa,
                #22d3ee
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        header p {
            margin-top: 12px;
            color: #cbd5e1;
            font-size: 16px;
        }

        @keyframes titleGlow {
            from {
                filter: drop-shadow(0 0 5px rgba(96,165,250,.2));
            }

            to {
                filter: drop-shadow(0 0 18px rgba(34,211,238,.4));
            }
        }

        /* Gallery */

        .gallery {
            width: min(1100px, 92%);
            margin: auto;
            padding: 20px 0 80px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        /* Image Card */

        .photo-card {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            aspect-ratio: 1 / 1;

            background: #111827;

            border: 1px solid rgba(255,255,255,.12);

            box-shadow:
                0 15px 40px rgba(0,0,0,.35);

            opacity: 0;
            transform: translateY(80px) scale(.96);

            transition:
                opacity .9s ease,
                transform .9s ease,
                box-shadow .3s ease;
        }

        /* Scroll animation */

        .photo-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Image */

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            transition:
                transform .6s ease,
                filter .6s ease;
        }

        /* Hover */

        .photo-card:hover {
            transform: translateY(-8px) scale(1.015);

            box-shadow:
                0 20px 55px rgba(59,130,246,.25);
        }

        .photo-card:hover img {
            transform: scale(1.08);
            filter: brightness(.78);
        }

        /* Number */

        .number {
            position: absolute;
            top: 12px;
            left: 12px;

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(0,0,0,.55);
            backdrop-filter: blur(8px);

            font-weight: bold;
            z-index: 2;

            border: 1px solid rgba(255,255,255,.2);
        }

        /* Footer */

        footer {
            text-align: center;
            padding: 30px 20px 45px;

            color: #94a3b8;
            font-size: 14px;
        }

        footer strong {
            color: #60a5fa;
        }

        /* Lightbox */

        .lightbox {
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.92);

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 9999;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 90vh;

            object-fit: contain;

            border-radius: 15px;

            box-shadow:
                0 20px 70px rgba(0,0,0,.7);
        }

        .close {
            position: fixed;
            top: 20px;
            right: 25px;

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,.12);
            color: white;

            font-size: 28px;
            cursor: pointer;

            backdrop-filter: blur(8px);
        }

        /* Mobile */

        @media (max-width: 600px) {

            header {
                padding: 55px 15px 30px;
            }

            header p {
                font-size: 14px;
            }

            .gallery {
                width: 94%;
                gap: 12px;
            }

            .photo-card {
                border-radius: 14px;
            }

            .number {
                width: 30px;
                height: 30px;
                font-size: 13px;
                top: 7px;
                left: 7px;
            }
        }

    </style>

</head>

<body>

    <!-- Heading -->

    <header>

        <h1>Shahriar Foysal Sad</h1>

        <p>Welcome to my official photo gallery</p>

    </header>


    <!-- Photo Gallery -->

    <main class="gallery">

        <div class="photo-card">
            <span class="number">1</span>

            <img
                src="images/ba05ca65-1643-45c9-9303-1acea6d61913.jpg"
                alt="Shahriar Foysal Sad photo 1"
                loading="eager">
        </div>


        <div class="photo-card">
            <span class="number">2</span>

            <img
                src="images/4c32d170-98b8-4cab-8036-c7175e5a9812.jpg"
                alt="Shahriar Foysal Sad photo 2"
                loading="eager">
        </div>


        <div class="photo-card">
            <span class="number">3</span>

            <img
                src="images/4b16b146-9632-447b-823d-b2418e235f29.jpg"
                alt="Shahriar Foysal Sad photo 3"
                loading="lazy">
        </div>


        <div class="photo-card">
            <span class="number">4</span>

            <img
                src="images/9286b3c0-69ff-4fbb-9cf4-548e1f82bf45.jpg"
                alt="Shahriar Foysal Sad photo 4"
                loading="lazy">
        </div>


        <div class="photo-card">
            <span class="number">5</span>

            <img
                src="images/e880efd2-9b08-4df7-9318-ecb3754919d4.jpg"
                alt="Shahriar Foysal Sad photo 5"
                loading="lazy">
        </div>


        <div class="photo-card">
            <span class="number">6</span>

            <img
                src="images/36bab14b-66ce-430d-84fa-2a9e57fe9866.jpg"
                alt="Shahriar Foysal Sad photo 6"
                loading="lazy">
        </div>

    </main>


    <footer>

        © 2026 <strong>Shahriar Foysal Sad</strong>
        · Official Website

    </footer>


    <!-- Image Fullscreen -->

    <div class="lightbox" id="lightbox">

        <button class="close" id="closeBtn">&times;</button>

        <img id="bigImage" src="" alt="Shahriar Foysal Sad">

    </div>


    <script>

        /* =========================
           SCROLL ANIMATION
        ========================= */

        const cards = document.querySelectorAll(".photo-card");

        const observer = new IntersectionObserver(
            (entries) => {

                entries.forEach((entry) => {

                    if (entry.isIntersecting) {

                        entry.target.classList.add("show");

                    }

                });

            },
            {
                threshold: 0.15
            }
        );


        cards.forEach((card) => {

            observer.observe(card);

        });


        /* =========================
           IMAGE LIGHTBOX
        ========================= */

        const lightbox = document.getElementById("lightbox");
        const bigImage = document.getElementById("bigImage");
        const closeBtn = document.getElementById("closeBtn");


        document.querySelectorAll(".photo-card img")
            .forEach((image) => {

                image.addEventListener("click", () => {

                    bigImage.src = image.src;

                    bigImage.alt = image.alt;

                    lightbox.classList.add("active");

                });

            });


        closeBtn.addEventListener("click", () => {

            lightbox.classList.remove("active");

        });


        lightbox.addEventListener("click", (event) => {

            if (event.target === lightbox) {

                lightbox.classList.remove("active");

            }

        });


        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {

                lightbox.classList.remove("active");

            }

        });

    </script>

</body>
</html>
